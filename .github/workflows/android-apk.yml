name: Android APK

on:
  push:
    branches: [main, 'feature/mobile-app', 'claude/**']
    paths: ['mobile/**', 'shared/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['mobile/**', 'shared/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Debug-key signed release build: installable on any phone for testing (not for Play Store upload).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kids-explorer-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
